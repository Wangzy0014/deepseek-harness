name: Study companion

on:
  push:
    branches: [keill, weiwenyu, master]
    paths:
      - 'modules/**'
      - 'competition/**'
      - '.agents/skills/study-companion/**'
      - '.github/workflows/study-companion.yml'
      - 'package.json'
  pull_request:
    paths:
      - 'modules/**'
      - 'competition/**'
      - '.agents/skills/study-companion/**'
      - '.github/workflows/study-companion.yml'
      - 'package.json'

permissions:
  contents: read

jobs:
  business-modules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - name: Install the local business toolchain
        run: npm ci --prefix modules/data --ignore-scripts --workspaces=false
      - name: Build and test synthetic cases
        run: npm run study:test
      - name: Export a self-contained synthetic demo
        run: npm run study:demo -- --out tmp/study-data/demo-ci

  python-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v9.0.0
        with:
          python-version: '3.9'
      - name: Install pytest
        run: python -m pip install pytest
      - name: Python reference tests (incl. property tests)
        run: |
          cd competition
          python -m pytest tests/ -q
